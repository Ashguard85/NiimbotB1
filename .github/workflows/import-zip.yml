name: Import uploaded ZIP

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import-and-deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Find exactly one ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mapfile -t zips < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            mapfile -t zips < <(git diff --name-only --diff-filter=AM HEAD^ HEAD -- '*.zip')
          else
            mapfile -t zips < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          fi
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP, found ${#zips[@]}."
            printf '%s\n' "${zips[@]:-}"
            exit 1
          fi
          echo "file=${zips[0]}" >> "$GITHUB_OUTPUT"
      - name: Validate and unpack
        shell: bash
        env:
          ZIPFILE: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          entries="$(unzip -Z1 "$ZIPFILE")"
          if printf '%s\n' "$entries" | grep -Eq '(^|/)\.\.(/|$)|(^|/)\.git(/|$)'; then
            echo "Unsafe ZIP path detected."; exit 1
          fi
          if printf '%s\n' "$entries" | grep -Eqi '(^|/)\.env($|/)|\.pem$|\.key$|(^|/)id_rsa($|\.)'; then
            echo "Potential secret file detected in ZIP."; exit 1
          fi
          unzip -q "$ZIPFILE" -d "$tmp"
          # Release ZIP represents repository root. Workflows are bootstrap/admin files
          # and are deliberately never changed by an automated GITHUB_TOKEN push.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='*.zip' \
            "$tmp"/ ./
          # Remove all uploaded release ZIPs after a successful extraction.
          rm -f ./*.zip
      - name: Commit imported release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::Safety check: automated ZIP import must not modify .github/workflows/."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Import ZIP release"
            git push
          fi
      - name: Verify GitHub Pages is enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages ist noch nicht aktiviert. Einmalig: Settings → Pages → Build and deployment → Source: GitHub Actions. Danach Workflow erneut starten."
            exit 1
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::GitHub Pages Status konnte nicht geprüft werden (HTTP $code)."
            cat /tmp/pages.json || true
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy imported release
        id: deployment
        uses: actions/deploy-pages@v4
