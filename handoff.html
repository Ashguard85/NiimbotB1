<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; connect-src 'self';">
  <title>NIIMBOT Übergabe</title>
  <link rel="stylesheet" href="./handoff.css?v=27">
</head>
<body>
  <main id="card" class="card">
    <div id="workingUi">
      <div class="eyebrow">NIIMBOT</div>
      <h1>Label übergeben</h1>
      <p id="status">Bestehenden Drucktab suchen …</p>
      <div id="actions" class="actions">
        <button id="focusTab" type="button" hidden>Zum Drucktab wechseln</button>
        <button id="closeTab" class="secondary" type="button" hidden>Hilfstab schließen / zurück</button>
      </div>
      <details id="diagnosticsBox">
        <summary>Bluefy-/Browser-Diagnose</summary>
        <pre id="diagnostics">wird ermittelt …</pre>
      </details>
    </div>
    <div id="doneUi" class="done" hidden>
      <div class="done-mark" aria-hidden="true">✓</div>
      <h1>Label übernommen</h1>
      <p>Zurück zum Drucktab wechseln.</p>
    </div>
  </main>
  <script src="./handoff.js?v=27" defer></script>
</body>
</html>
